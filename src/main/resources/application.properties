spring.application.name=simple-meal-planner
spring.devtools.add-properties=false

spring.profiles.default=local
# 'validate': Flyway; zuvor 'update'
spring.jpa.hibernate.ddl-auto=validate

# Spring Boot Port Configuration
# -> Diese Einstellung überschreibt die Standardportnummer 8080, damit die Anwendung auf Port 8081 läuft.
# -> Wichtig, weil der Backend-Container für Flutter auf Port 8080 läuft, und wir möchten Konflikte vermeiden.
# server.port=8080

# Recipe API Configuration
recipe.api.key=${RECIPE_API_KEY}
recipe.api.base=https://gustar-io-deutsche-rezepte.p.rapidapi.com
recipe.api.host=gustar-io-deutsche-rezepte.p.rapidapi.com

recipe.api.passwordhash=${RECIPE_API_PWHASH}

# JWT / Auth configuration
# NOTE: Must be provided via the JWT_SECRET environment variable (min. 32 bytes for HMAC-SHA256).
# Keep the secret outside of source control.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=36000000

# Disabled by default. Enable explicitly in local/test environments if a seed user is required.
app.security.seed-default-user.enabled=false
# app.security.user.name=admin
# app.security.user.password=secret
