# Production profile.
#
# The datasource stays environment-variable driven (see application-docker.properties);
# this profile only controls behavior. Production runs with SPRING_PROFILES_ACTIVE=docker,prod.

# No demo data and no seeded default user in production.
app.autofill.enabled=false
app.security.seed-default-user.enabled=false

# The application is packaged into an image; there is no compose file to start from within the app.
spring.docker.compose.enabled=false