# ================================
# DATENBANK (H2 für Tests)
# ================================

# In-Memory-Datenbank (existiert nur während des Testlaufs)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# H2 JDBC-Treiber
spring.datasource.driver-class-name=org.h2.Driver

# Standard-Zugangsdaten
spring.datasource.username=sa
spring.datasource.password=

# ================================
# JPA / HIBERNATE
# ================================

# Schema wird bei jedem Testlauf neu erstellt und danach gelöscht
spring.jpa.hibernate.ddl-auto=create-drop

# Expliziter Dialekt (verhindert Probleme in CI)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# SQL-Statements im Log anzeigen (hilfreich beim Debuggen)
spring.jpa.show-sql=true

# Formatiertes SQL für bessere Lesbarkeit
spring.jpa.properties.hibernate.format_sql=true

# ================================
# TEST-STABILITÄT / CI
# ================================

# Verhindert, dass Docker Compose in Tests gestartet wird
spring.docker.compose.enabled=false

# Deaktiviert DevTools Restart (unnötig im Test)
spring.devtools.restart.enabled=false

# Schnellere Tests: kein Lazy Loading Fehler durch offene Sessions
spring.jpa.open-in-view=false

# ================================
# LOGGING (optional feinjustieren)
# ================================

# Weniger Log-Spam von Hibernate
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# ================================
# SERVER (optional)
# ================================

# Verhindert Port-Konflikte in CI
server.port=0