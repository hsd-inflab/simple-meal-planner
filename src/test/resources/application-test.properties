# Verwendet eine In-Memory-H2-Datenbank nur für Tests.
# Dadurch wird beim Test keine echte PostgreSQL-Datenbank benötigt.
spring.datasource.url=jdbc:h2:mem:testdb

# JDBC-Treiber für H2.
spring.datasource.driver-class-name=org.h2.Driver

# Standard-Benutzer für H2.
spring.datasource.username=sa

# H2 benötigt standardmäßig kein Passwort.
spring.datasource.password=

# Erstellt das Datenbankschema beim Teststart
# und löscht es nach dem Testlauf wieder.
spring.jpa.hibernate.ddl-auto=create-drop