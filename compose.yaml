services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=${LOCAL_DB_NAME}'
      - 'POSTGRES_USER=${LOCAL_DB_USER}'
      - 'POSTGRES_PASSWORD=${LOCAL_DB_PASSWORD}'
    ports:
      - '5432:5432'
    volumes:
      - test_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER} -d ${LOCAL_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:10
    command: migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql
    environment:
      - 'FLYWAY_URL=jdbc:postgresql://postgres:5432/${LOCAL_DB_NAME}'
      - 'FLYWAY_USER=${LOCAL_DB_USER}'
      - 'FLYWAY_PASSWORD=${LOCAL_DB_PASSWORD}'

  backend:
    build: .
    depends_on:
      flyway:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - APP_AUTOFILL_ENABLED=true
      - LOCAL_DB_NAME=${LOCAL_DB_NAME}
      - LOCAL_DB_USER=${LOCAL_DB_USER}
      - LOCAL_DB_PASSWORD=${LOCAL_DB_PASSWORD}

volumes:
  test_db_data: